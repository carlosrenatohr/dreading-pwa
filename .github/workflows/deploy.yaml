name: Deploy PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test
        run: node --test
      - name: Deploy to Cloudflare Pages
        # Requires repository secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages:Edit)
        # + CLOUDFLARE_ACCOUNT_ID.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=dreading-pwa --branch=main
